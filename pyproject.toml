[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matinee"
version = "0.1.0"
description = "Play video on a Tronbyt 64x32 LED matrix display"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "Pillow>=10.0",
    "yt-dlp>=2024.1",
    "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
matinee = "matinee.cli:main"
matinee-ingest = "matinee.ingest:main"
matinee-daemon = "matinee.daemon:main"

[tool.setuptools.packages.find]
include = ["matinee*"]
